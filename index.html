<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Gradient Mapper</title>

<!-- ============ OPEN GRAPH / LINK PREVIEW ============ -->
<meta property="og:type" content="website" />
<meta property="og:title" content="every else" />
<meta property="og:description" content="A gentle gaze, for everything else." />
<meta property="og:image" content="https://gazecanvas.com/images/Og_image_graphictool.jpg" />
<meta property="og:url" content="https://gazecanvas.com/" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="every else" />
<meta name="twitter:description" content="A gentle gaze, for everything else." />
<meta name="twitter:image" content="https://gazecanvas.com/images/Og_image_graphictool.jpg" />

<link rel="stylesheet" href="style.css?v=34" />
</head>
<body>

  <!-- ============ MOBILE ONBOARDING (<=768px only) — shown until the user
       uploads a photo, then hidden by js/mobileLayout.js. ============ -->
  <div id="mobileOnboarding" class="mobile-onboarding">
    <img class="mobile-header" src="images/mo_header.jpg" alt="every else" />
    <img class="mobile-onboarding__gif" src="images/example.gif" alt="" />
    <div class="mobile-onboarding__footer">
      <p class="mobile-onboarding__caption">Which photo reflects your gaze?</p>
      <button type="button" id="mobileOnboardingUpload" class="mobile-onboarding__upload-btn">
        <img src="images/onboarding_upload button.svg" alt="Upload Image" />
      </button>
    </div>
  </div>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <img class="app-header__logo" src="images/Logo.svg" alt="every else" />
  </header>

  <!-- ============ MOBILE HEADER (<=768px only) ============ -->
  <img id="mobileHeaderImg" class="mobile-header" src="images/mo_header.jpg" alt="every else" />

  <div class="app-shell">

    <!-- ============ LEFT GLASS PANEL ============ -->
    <aside class="glass-panel glass-panel--left">
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" hidden />

      <div class="field-group">
        <span class="field-label">Image</span>
        <button class="btn btn--primary" id="uploadBtn">Upload Image</button>
        <div class="file-meta" id="fileMeta">No image loaded</div>
      </div>

      <div class="field-group">
        <span class="field-label">Export</span>
        <button class="btn" id="exportBtn">
          Export Image
          <img class="btn__icon" src="images/export logo.svg" alt="" />
        </button>
      </div>
    </aside>

    <!-- ============ CENTER: PILL PREVIEW ============ -->
    <main class="pill-stage-wrapper">
      <div class="canvas-frame" id="canvasFrame">
        <div class="canvas-wrapper" id="canvasWrapper">
          <div class="canvas-stage" id="canvasStage">
            <canvas id="artCanvas" width="1200" height="780"></canvas>
          </div>
        </div>
      </div>

    </main>

    <!-- ============ RIGHT GLASS PANEL: RENDER CONTROLS ============ -->
    <aside class="glass-panel glass-panel--right">
      <section class="panel-section">
        <h2 class="panel-title">Render Controls</h2>
        <div class="controls-grid" id="controlsGrid">
          <!-- Slider rows are injected by controls.js -->
        </div>
        <button class="btn btn--dark btn--reset" id="resetBtn">Reset</button>
      </section>
    </aside>

    <!-- ============ MOBILE CONTROLS CARD (<=768px only, populated by js/mobileLayout.js) ============ -->
    <div id="mobileControlsCard" class="glass-panel mobile-controls-card"></div>

    <!-- ============ MOBILE EXPORT BACKDROP + ACTIONS (<=768px only, shown by
         js/mobileExport.js after tapping Next) ============ -->
    <div class="mobile-export-backdrop"></div>
    <div id="mobileExportFooter" class="mobile-export-footer">
      <p class="mobile-export-caption">A gentle gaze, for everything else</p>
      <div id="mobileExportActions" class="mobile-export-actions">
        <button type="button" id="mobileExportIconBtn" class="mobile-export-icon-btn" aria-label="Download image">
          <img src="images/export.svg" alt="" />
        </button>
        <button type="button" id="mobileShareBtn" class="mobile-share-btn" aria-label="Share">
          <img src="images/share.svg" alt="" />
        </button>
      </div>
    </div>

  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="app-footer">
    <img class="app-footer__mark" src="images/footer.svg" alt="© every else. All rights reserved." />
  </footer>

  <!-- ============ CUSTOM CURSOR ============ -->
  <img id="customCursor" class="custom-cursor" src="images/Cursor.svg" alt="" aria-hidden="true" />

  <script src="js/config.js?v=4"></script>
  <script src="js/utils.js?v=2"></script>
  <script src="js/state.js?v=2"></script>
  <script src="js/imageLoader.js?v=2"></script>
  <script src="js/circleEngine.js?v=2"></script>
  <script src="js/circleAnimator.js?v=2"></script>
  <script src="js/canvasView.js?v=4"></script>
  <script src="js/maskPainter.js?v=2"></script>
  <script src="js/controls.js?v=2"></script>
  <script src="js/exporter.js?v=2"></script>
  <script src="js/customCursor.js?v=3"></script>
  <script src="js/mobileLayout.js?v=4"></script>
  <script src="js/mobileExport.js?v=7"></script>
  <script src="js/main.js?v=4"></script>
</body>
</html>
